
name: Build QuickPlayer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -1)
          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d extracted
            PROJECT=$(find extracted -name settings.gradle -print -quit)
            PROJECT_DIR=$(dirname "$PROJECT")
          else
            PROJECT_DIR=.
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickPlayer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
